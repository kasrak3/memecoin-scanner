name: Memecoin Safety Scanner

# Instead of relying only on GitHub's own 15-minute schedule trigger
# (which gets throttled/delayed under load, sometimes to every 2-3
# hours), this job loops internally: once it starts, it re-runs the
# scanner every ~2 minutes for close to 6 hours (the hard cap for
# GitHub-hosted runners). The schedule below only needs to succeed at
# kicking off a fresh loop roughly every 6 hours, which is far less
# prone to delay than a 15-minute schedule.

on:
  schedule:
    - cron: '13 */6 * * *'   # off-peak minute, every 6 hours -- restarts the loop
  workflow_dispatch: {}

permissions:
  contents: write   # needed so the workflow can save its "already checked" state back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # just under GitHub's 6-hour hard limit for hosted runners
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git
        run: |
          git config user.name "memecoin-scanner-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run scanner every ~2 minutes for up to ~5h45m
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          END=$((SECONDS + 20700))
          while [ $SECONDS -lt $END ]; do
            python memecoin_scanner.py
            git add scanner_state.json
            git diff --staged --quiet || git commit -m "Update scanner state" --quiet
            git push --quiet || true
            sleep 120
          done
